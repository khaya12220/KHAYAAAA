 name: Build KHAYA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build KHAYA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Check Flutter installation
        run: flutter --version

      - name: Check KHAYA project
        working-directory: flutter_application_1
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_application_1
        run: flutter pub get

      - name: Build KHAYA APK
        working-directory: flutter_application_1
        run: flutter build apk --release

      - name: Upload KHAYA APK
        uses: actions/upload-artifact@v4
        with:
          name: KHAYA-release-apk
          path: flutter_application_1/build/app/outputs/flutter-apk/app-release.apk
